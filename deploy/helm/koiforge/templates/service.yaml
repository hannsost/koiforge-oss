apiVersion: v1
kind: Service
metadata:
  name: {{ include "koiforge.fullname" . }}
  labels:
    {{- include "koiforge.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "koiforge.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: web
      protocol: TCP
