apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "koiforge.fullname" . }}
  labels:
    {{- include "koiforge.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "koiforge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "koiforge.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "koiforge.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "koiforge.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/index.js"]
          workingDir: /app/api
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 127.0.0.1
            - name: PORT
              value: "3000"
            - name: KOIFORGE_PUBLIC_ORIGIN
              value: {{ required "publicOrigin must be an exact HTTPS origin" .Values.publicOrigin | quote }}
            - name: KOIFORGE_STATE_ROOT
              value: /var/lib/koiforge/state
            - name: KOIFORGE_IMPORT_DATA_ROOT
              value: /var/lib/koiforge/state
            - name: KOIFORGE_GENERATION_DISABLED
              value: "1"
            {{- with .Values.monitoring.prometheusUrl }}
            - name: KOIFORGE_PROMETHEUS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.monitoring.gitlabQueue.existingSecret }}
            - name: KOIFORGE_GITLAB_QUEUE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.monitoring.gitlabQueue.tokenKey | quote }}
            - name: KOIFORGE_GITLAB_QUEUE_PROJECTS
              value: {{ join "," (required "monitoring.gitlabQueue.projects is required with a queue secret" $.Values.monitoring.gitlabQueue.projects) | quote }}
            {{- end }}
            {{- if .Values.oidc.enabled }}
            - name: KOIFORGE_OIDC_ISSUER
              value: {{ required "oidc.issuer is required when OIDC is enabled" .Values.oidc.issuer | quote }}
            - name: KOIFORGE_OIDC_CLIENT_ID
              value: {{ required "oidc.clientId is required when OIDC is enabled" .Values.oidc.clientId | quote }}
            {{- with .Values.oidc.backchannelOrigin }}
            - name: KOIFORGE_OIDC_BACKCHANNEL_ORIGIN
              value: {{ . | quote }}
            {{- end }}
            - name: KOIFORGE_OIDC_ADMIN_ROLE
              value: {{ .Values.oidc.adminRole | quote }}
            - name: KOIFORGE_OIDC_LABEL
              value: {{ .Values.oidc.label | quote }}
            {{- end }}
            {{- with .Values.bootstrap.existingSecret }}
            - name: KOIFORGE_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.bootstrap.key | quote }}
            {{- end }}
          ports:
            - name: api
              containerPort: 3000
              protocol: TCP
          startupProbe:
            exec:
              command:
                - node
                - -e
                - "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.apiResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              # State is a child so its process lease can live beside it on
              # the same PVC without any overlapping writable root mount.
              mountPath: /var/lib/koiforge
            - name: api-tmp
              mountPath: /tmp
        - name: web
          image: {{ include "koiforge.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - name: web
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: web
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: web
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: web
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.webResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: web-tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "koiforge.stateClaim" . }}
        - name: api-tmp
          emptyDir: {}
        - name: web-tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
